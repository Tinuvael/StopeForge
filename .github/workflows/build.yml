name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Run tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: tests

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: StopeForge-Windows
            smoke_command: .\dist\StopeForge\StopeForge.exe --smoke-test
            artifact_path: dist\StopeForge

          - os: macos-15-intel
            artifact_name: StopeForge-macOS-Intel
            smoke_command: ./dist/StopeForge.app/Contents/MacOS/StopeForge --smoke-test
            artifact_path: dist/StopeForge.app

          - os: macos-26
            artifact_name: StopeForge-macOS-AppleSilicon
            smoke_command: ./dist/StopeForge.app/Contents/MacOS/StopeForge --smoke-test
            artifact_path: dist/StopeForge.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pyinstaller --noconfirm StopeForge.spec

      - name: Smoke test packaged app
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: ${{ matrix.smoke_command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
