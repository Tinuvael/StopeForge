name: Build StopeForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name StopeForge `
            --icon assets/icons/stopeforge_icon.ico `
            --add-data "assets;assets" `
            run.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopeForge-Windows
          path: dist/StopeForge.exe

  build-macos-intel:
    name: Build macOS Intel APP
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check architecture
        run: |
          uname -m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build macOS app
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name StopeForge \
            --icon assets/icons/stopeforge_icon.icns \
            --add-data "assets:assets" \
            run.py

      - name: Remove quarantine attributes
        run: |
          xattr -cr dist/StopeForge.app || true

      - name: Zip macOS app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent StopeForge.app StopeForge-macOS-Intel.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopeForge-macOS-Intel
          path: dist/StopeForge-macOS-Intel.zip
